<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barista POS</title>

<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;padding:10px 10px 80px;font-family:system-ui;background:#f2f2f2}
h1{text-align:center;margin:8px 0}

.page{display:none}
.page.active{display:block}

section{background:#fff;padding:12px;margin-bottom:12px;border-radius:12px}

input,button,textarea{
  width:100%;padding:14px;font-size:16px;
  margin-bottom:8px;border-radius:10px;border:none
}
textarea{resize:vertical;min-height:140px}
button{cursor:pointer}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px
}

.product-btn{background:#111;color:#fff;height:70px}
.cash{background:#4CAF50;color:#fff}
.card{background:#2196F3;color:#fff}
.add{background:#000;color:#fff}
.delete{background:#e53935;color:#fff}

.report-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  margin-bottom:6px
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:#111
}
.bottom-nav button{
  flex:1;color:#fff;background:none;border-radius:0
}
</style>
</head>

<body>

<h1>☕ Barista POS</h1>

<!-- ===== КАССА ===== -->
<div class="page active" id="page-pos">
  <section>
    <input type="date" id="date">
  </section>

  <section>
    <input placeholder="🔍 Поиск товара" oninput="renderProducts(this.value)">
    <div id="products" class="grid"></div>
    <div id="extrasPanel"></div>
    <div id="pricePanel"></div>
  </section>
</div>

<!-- ===== ОТЧЁТ ===== -->
<div class="page" id="page-report">
  <section>
    <input type="number" id="salary" placeholder="ЗП (например 500)">
    <button class="delete" onclick="clearDay()">🗑 Очистить день</button>

    <div id="report"></div>

    <hr>
    <strong>📝 Заметки за день</strong>
    <textarea
      id="notes"
      placeholder="Введите заметки за день"
      oninput="saveNotes()"
    ></textarea>
  </section>
</div>

<!-- ===== ТОВАРЫ ===== -->
<div class="page" id="page-products">
  <section>
    <input id="productName" placeholder="Название товара">
    <input id="price" type="number" placeholder="Цена">
    <button class="add" onclick="addProduct()">Сохранить товар</button>
  </section>
</div>

<!-- ===== НАВИГАЦИЯ ===== -->
<div class="bottom-nav">
  <button onclick="showPage('page-pos')">☕ Касса</button>
  <button onclick="showPage('page-report')">📊 Отчёт</button>
  <button onclick="showPage('page-products')">⚙ Товары</button>
</div>

<script>
const dateInput=document.getElementById("date");
dateInput.value=new Date().toISOString().slice(0,10);

let products=JSON.parse(localStorage.getItem("products"))||[];
let sales=JSON.parse(localStorage.getItem("sales"))||[];
let notes=JSON.parse(localStorage.getItem("notes"))||{};

let selectedProduct=null;

/* ===== SAVE ===== */
function save(){
  localStorage.setItem("products",JSON.stringify(products));
  localStorage.setItem("sales",JSON.stringify(sales));
  localStorage.setItem("notes",JSON.stringify(notes));
}

/* ===== NAV ===== */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  renderProducts();
  renderReport();
  loadNotes();
}

/* ===== NOTES ===== */
const notesInput=document.getElementById("notes");
function saveNotes(){
  notes[dateInput.value]=notesInput.value;
  save();
}
function loadNotes(){
  notesInput.value=notes[dateInput.value]||"";
}

/* ===== PRODUCTS ===== */
function addProduct(){
  if(!productName.value||!price.value)return;
  products.push({id:Date.now(),name:productName.value,price:+price.value});
  productName.value=price.value="";
  save();renderProducts();
}

function renderProducts(filter=""){
  productsDiv.innerHTML="";
  products
    .filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(p=>{
      const b=document.createElement("button");
      b.className="product-btn";
      b.innerText=p.name;
      b.onclick=()=>sell(p);
      productsDiv.appendChild(b);
    });
}
const productsDiv=document.getElementById("products");

/* ===== SELL ===== */
function sell(p){
  sales.push({
    date:dateInput.value,
    price:p.price
  });
  save();renderReport();
}

/* ===== REPORT ===== */
function renderReport(){
  report.innerHTML="";
  const day=sales.filter(s=>s.date===dateInput.value);
  let sum=0;
  day.forEach(s=>sum+=s.price);

  const base=+salary.value||0;
  const percent=sum*0.03;

  report.innerHTML=`
    💰 Касса: ${sum}<br>
    👤 ЗП: ${base}<br>
    📈 3%: ${percent.toFixed(2)}<br>
    <strong>Итог ЗП: ${(base+percent).toFixed(2)}</strong>
  `;
}

function clearDay(){
  if(!confirm("Очистить день?"))return;
  sales=sales.filter(s=>s.date!==dateInput.value);
  notes[dateInput.value]="";
  save();renderReport();loadNotes();
}

/* ===== INIT ===== */
dateInput.onchange=()=>{renderReport();loadNotes()};
renderProducts();renderReport();loadNotes();
</script>

</body>
</html>
