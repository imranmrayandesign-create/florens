<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barista POS</title>

<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;padding:10px 10px 80px;font-family:system-ui;background:#f2f2f2}
h1{text-align:center;margin:8px 0}

.page{display:none}
.page.active{display:block}

section{background:#fff;padding:12px;margin-bottom:12px;border-radius:12px}

input,button,textarea{
  width:100%;padding:14px;font-size:16px;
  margin-bottom:8px;border-radius:10px;border:none
}
textarea{resize:vertical;min-height:80px}

button{cursor:pointer}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px
}

.product-btn{background:#111;color:#fff;height:70px}
.cash{background:#4CAF50;color:#fff}
.card{background:#2196F3;color:#fff}
.add{background:#000;color:#fff}
.delete{background:#e53935;color:#fff}
.edit{background:#fb8c00;color:#fff}

.admin-tools{display:flex;gap:4px}
.admin-tools button{width:50%;font-size:14px}

.report-line{
  display:flex;justify-content:space-between;
  align-items:center;font-size:15px;margin-bottom:6px
}

.summary-item{padding:4px 0;font-size:15px}

.delete-small{
  width:28px!important;height:28px;
  padding:0;font-size:14px;border-radius:6px
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:#111
}
.bottom-nav button{
  flex:1;color:#fff;background:none;border-radius:0
}
</style>
</head>

<body>

<h1>☕ Barista POS</h1>

<!-- КАССА -->
<div class="page active" id="page-pos">
  <section>
    <input type="date" id="date">
  </section>

  <section>
    <input placeholder="🔍 Поиск товара" oninput="renderProducts(this.value)">
    <div id="products" class="grid"></div>
    <div id="extrasPanel"></div>
    <div id="pricePanel"></div>
  </section>
</div>

<!-- ОТЧЁТ -->
<div class="page" id="page-report">
  <section>
    <input type="number" id="salary" placeholder="ЗП (например 500)">

    <textarea
      id="notes"
      placeholder="📝 Заметки за день"
      oninput="saveNotes()"
    ></textarea>

    <button class="delete" onclick="clearDay()">🗑 Очистить день</button>

    <div id="report"></div>
  </section>
</div>

<!-- ТОВАРЫ -->
<div class="page" id="page-products">
  <section>
    <h3>➕ / ✏️ Товар</h3>
    <input type="hidden" id="productId">
    <input id="productName" placeholder="Название">
    <input id="price1" type="number" placeholder="Цена 1">
    <input id="price2" type="number" placeholder="Цена 2 (необязательно)">
    <button class="add" onclick="saveProduct()">Сохранить товар</button>
  </section>

  <section>
    <h3>➕ / ✏️ Доп. услуга</h3>
    <input type="hidden" id="extraId">
    <input id="extraName" placeholder="Название">
    <input id="extraPrice" type="number" placeholder="Цена">
    <button class="add" onclick="saveExtra()">Сохранить услугу</button>
  </section>

  <section>
    <h3>Список товаров</h3>
    <div id="productsAdmin"></div>
  </section>

  <section>
    <h3>Список доп. услуг</h3>
    <div id="extrasAdmin"></div>
  </section>
</div>

<!-- НАВИГАЦИЯ -->
<div class="bottom-nav">
  <button onclick="showPage('page-pos')">☕ Касса</button>
  <button onclick="showPage('page-report')">📊 Отчёт</button>
  <button onclick="showPage('page-products')">⚙ Товары</button>
</div>

<script>
const dateInput=document.getElementById("date");
dateInput.value=new Date().toISOString().slice(0,10);

let products=JSON.parse(localStorage.getItem("products"))||[];
let extras=JSON.parse(localStorage.getItem("extras"))||[];
let sales=JSON.parse(localStorage.getItem("sales"))||[];
let notes=JSON.parse(localStorage.getItem("notes"))||{};

let selectedProduct=null;
let selectedExtras=[];

/* SAVE */
function save(){
  localStorage.setItem("products",JSON.stringify(products));
  localStorage.setItem("extras",JSON.stringify(extras));
  localStorage.setItem("sales",JSON.stringify(sales));
  localStorage.setItem("notes",JSON.stringify(notes));
}

/* NOTES */
function saveNotes(){
  notes[dateInput.value]=notesInput.value;
  save();
}
function loadNotes(){
  notesInput.value=notes[dateInput.value]||"";
}
const notesInput=document.getElementById("notes");

/* NAV */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  renderProducts();
  renderProductsAdmin();
  renderExtrasAdmin();
  renderReport();
  loadNotes();
}

/* PRODUCTS */
function saveProduct(){
  const id=productId.value;
  if(!productName.value||!price1.value)return alert("Введите данные");
  const prices=price2.value?[+price1.value,+price2.value]:[+price1.value];

  if(id){
    const p=products.find(p=>p.id==id);
    p.name=productName.value;p.prices=prices;
  }else{
    products.push({id:Date.now(),name:productName.value,prices});
  }

  productId.value=productName.value=price1.value=price2.value="";
  save();renderProducts();renderProductsAdmin();
}

function deleteProduct(id){
  if(sales.some(s=>s.productId===id))return alert("Товар уже продавался");
  products=products.filter(p=>p.id!==id);
  save();renderProducts();renderProductsAdmin();
}

/* EXTRAS */
function saveExtra(){
  if(!extraName.value||!extraPrice.value)return alert("Введите данные");
  extras.push({id:Date.now(),name:extraName.value,price:+extraPrice.value});
  extraName.value=extraPrice.value="";
  save();renderExtrasAdmin();
}

/* POS */
function renderProducts(filter=""){
  productsDiv.innerHTML="";
  products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(p=>{
      const b=document.createElement("button");
      b.className="product-btn";
      b.innerText=p.name;
      b.onclick=()=>selectProduct(p);
      productsDiv.appendChild(b);
    });
}
const productsDiv=document.getElementById("products");

function selectProduct(p){
  selectedProduct=p;selectedExtras=[];
  renderExtras();renderPrices();
}

function renderExtras(){
  extrasPanel.innerHTML="<strong>Доп. услуги</strong>";
  extras.forEach(x=>{
    const b=document.createElement("button");
    b.innerText=`${x.name} +${x.price}`;
    b.onclick=()=>{selectedExtras.push(x);renderPrices()};
    extrasPanel.appendChild(b);
  });
}

function renderPrices(){
  if(!selectedProduct)return;
  const extraSum=selectedExtras.reduce((s,e)=>s+e.price,0);
  pricePanel.innerHTML=`<strong>${selectedProduct.name}</strong>`;
  selectedProduct.prices.forEach(price=>{
    const total=price+extraSum;
    pricePanel.innerHTML+=`
      <button class="cash" onclick="sell(${total},'cash')">${total} грн 💵</button>
      <button class="card" onclick="sell(${total},'card')">${total} грн 💳</button>
    `;
  });
}

function sell(total,payment){
  sales.push({
    id:Date.now(),
    date:dateInput.value,
    productId:selectedProduct.id,
    price:total,
    payment
  });
  save();pricePanel.innerHTML="";renderReport();
}

/* REPORT */
function clearDay(){
  if(!confirm("Очистить день?"))return;
  sales=sales.filter(s=>s.date!==dateInput.value);
  notes[dateInput.value]="";
  save();renderReport();loadNotes();
}

function renderReport(){
  report.innerHTML="";
  const day=sales.filter(s=>s.date===dateInput.value);
  let cash=0,card=0,sum=0;

  day.forEach(s=>{
    sum+=s.price;
    s.payment==="cash"?cash+=s.price:card+=s.price;
    report.innerHTML+=`
      <div class="report-line">
        ${s.price} грн • ${s.payment==="cash"?"💵":"💳"}
      </div>`;
  });

  const base=+salary.value||0;
  const percent=sum*0.03;
  report.innerHTML+=`
    <hr>
    💵 Нал: ${cash}<br>
    💳 Карта: ${card}<br>
    💰 Касса: ${sum}<br>
    👤 ЗП: ${base}<br>
    📈 3%: ${percent.toFixed(2)}<br>
    <strong>Итог: ${(base+percent).toFixed(2)}</strong>
  `;
}

/* ADMIN */
function renderProductsAdmin(){
  productsAdmin.innerHTML="";
  products.forEach(p=>{
    productsAdmin.innerHTML+=`
      <div class="report-line">
        ${p.name}
        <button class="delete delete-small" onclick="deleteProduct(${p.id})">✖</button>
      </div>`;
  });
}

function renderExtrasAdmin(){
  extrasAdmin.innerHTML="";
  extras.forEach(e=>{
    extrasAdmin.innerHTML+=`
      <div class="report-line">
        ${e.name} +${e.price}
      </div>`;
  });
}

/* INIT */
dateInput.onchange=()=>{renderReport();loadNotes()};
renderProducts();renderProductsAdmin();renderExtrasAdmin();renderReport();loadNotes();
</script>

</body>
</html>
